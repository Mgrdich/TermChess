requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.2",
    "onnx>=1.20.1",
    "onnxruntime>=1.24.1",
    "onnxscript>=0.6.2",
    "python-chess>=1.999",
    "torch>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
